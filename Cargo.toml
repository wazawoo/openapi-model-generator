[package]
name = "openapi-model-generator"
version = "0.5.2"
edition = "2024"
description = "A (forked) robust Rust library and CLI tool for generating type-safe Rust models from OpenAPI 3.0 specifications with advanced composition support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wazawoo/openapi-model-generator"
readme = "README.md"

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openapiv3 = "2.2"
thiserror = "2.0"
serde_yaml = "0.9"
tracing = "0.1.41"
uuid = { version = "1.0", features = ["serde", "v4"] }
indexmap = "2.11"
bitflags = "2.10.0"
csv = "1.4.0"
